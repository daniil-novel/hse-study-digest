# Скопирует команда digest.py init. Правьте private/study.toml.
# Текст после # — подсказка. TODO внутри комментария не ломает файл.
[mcp]
enabled = true             # false разрешает работать только с источниками Smart LMS.
executable = "telegram-mcp" # TODO: укажите полный путь, если MCP в другом окружении.
env_file = ".env"           # Файл в корне проекта. Ключи Telegram в этот TOML не вносятся.

[agent]
provider = "codex"          # TODO: codex (подписка ChatGPT) или claude (Claude Code).
mode = "local"              # local: сообщения остаются на ноутбуке; cloud: разрешённые фрагменты получает провайдер.

[local]
auto_match = true           # false: читать только явно перечисленные или добавленные в tracked группы.
# TODO: запишите точные названия чатов, которые вы хотите проверить на своём компьютере.
# Для заголовка, отличающегося от дисциплины, форма записи такая:
# "Семинар наставника 25/26" = "Семинар наставника"
[local.chat_titles]
[local.chat_ids]
# "-1001234567890" = "Анализ данных"
[local.task_regex]
# TODO: свои выражения для текста сообщения → один из стандартных типов задания из local_digest.OBJECTS.
# "Подготовить презентацию" = ['(?i)принесите\s+слайды']

[scan]
max_dialogs = 350           # TODO: сколько последних по активности диалогов учитывать.
page_size = 50              # Порция ответа. Сервер допускает от 1 до 200.
sample_size = 3             # Сколько разрешённых сообщений дать для оценки одного чата.

[consent]
file = "telegram-scopes.toml" # Разрешённые чаты, сроки, материалы и поставщик модели.

[courses]
# TODO: перенесите дисциплины текущего периода из своей электронной зачётки.
"Анализ данных" = ["анализ данных", "data analysis"]

[schedule]
mode = "weekly"             # daily — каждый день; weekly — по дням; monthly — по числам.
weekdays = ["tue", "thu"]   # mon tue wed thu fri sat sun; используется для weekly.
month_days = [1, 15, -1]    # Для monthly: числа месяца. -1 = последний день месяца.
times = ["09:00"]           # Список времени, 24-часовой формат. Например ["09:00", "17:30"].
timezone = "Europe/Moscow"  # TODO: часовой пояс доставки. Сроки в таблице приводятся к МСК.
catchup_hours = 24          # После сна отправить только самый свежий выпуск в этом окне.
date_regex = ""             # Необязательно: регулярное выражение для даты YYYY-MM-DD.

[mail]
enabled = false             # После проверки отчёта задайте true для рассылки самому себе.
address = ""                # TODO: собственный адрес, одновременно отправитель и получатель.
host = "smtp.gmail.com"     # SMTP с TLS, порт 465. Пароль хранится отдельно.
port = 465                  # Порт SMTP с шифрованием при подключении (implicit TLS).

[lms]
calendar = ""               # Необязательно: файл .ics или выданная ВШЭ подписка.
use_notes = false           # true добавляет свои разрешённые заметки из private/lms.json.
[lms.api_courses]
# TODO при выданном ВШЭ токене: "12345" = "Анализ данных".

[service]
scan_interval_seconds = 900     # Реальный сбор каждые 15 минут при доступном ноутбуке.
tick_interval_seconds = 60      # Проверка расписания писем раз в минуту.
command_timeout_seconds = 3600  # Ограничение одного сбора: час; при большом числе чатов увеличьте.
