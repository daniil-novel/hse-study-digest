name: Windows and macOS practice checks
on:
  push:
    branches: [main, macos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install the same dependencies as the practice
        run: python -m pip install -r requirements-mcp.txt -r requirements-calendar.txt
      - name: Verify parsers, persistence, retrieval and service boundaries
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify installation and empty knowledge base
        env:
          PYTHONUTF8: '1'
        run: |
          python digest.py init
          python digest.py --help
          python digest.py wiki
          python digest.py search "задание"
          python digest.py status
          python digest.py schedule
          python digest.py install-skills codex
