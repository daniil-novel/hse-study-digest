name: macOS practice checks

on:
  push:
    branches: [macos, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Record environment and install classroom dependencies
        run: |
          printf '## macOS %s (%s), %s\n' "$(sw_vers -productVersion)" "$(uname -m)" "$(python --version)" >> "$GITHUB_STEP_SUMMARY"
          python -m pip install -r requirements.txt -r requirements-mcp.txt -r requirements-calendar.txt

      - name: Run the unit suite
        run: |
          python -m unittest discover -s tests -v
          echo 'Passed the unit suite with the optional calendar dependencies installed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise the real stdio server with synthetic Telegram data
        run: |
          python digest.py init
          python - <<'PY'
          import tomlkit
          from pathlib import Path
          path = Path("private/study.toml")
          config = tomlkit.parse(path.read_text())
          config["mcp"]["demo"] = True
          config["scan"]["page_size"] = 2
          config["mail"]["enabled"] = False
          path.write_text(tomlkit.dumps(config))
          PY
          python digest.py doctor
          python digest.py inventory
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path("private/dialogs-demo.csv").open(encoding="utf-8-sig", newline="") as src:
              rows = list(csv.DictReader(src, delimiter=";"))
          assert len(rows) == 3
          assert {(int(row["chat_id"].lstrip("'")), row["kind"]) for row in rows} == {
              (101, "private"), (-202, "group"), (-1000000000303, "channel"),
          }
          assert not Path("private/dialogs.csv").exists()
          PY
          echo 'MCP stdio negotiated successfully and returned all three synthetic dialogs over two pages. No Telegram account or model was used.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the generated LaunchAgent with Apple plutil
        run: |
          python - <<'PY'
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path
          from unittest.mock import patch
          from digest_schedule import LABEL, launch_agent
          root = Path.cwd()
          temp = Path(os.environ["RUNNER_TEMP"]) / "plist-check"
          with patch.object(Path, "home", return_value=temp), patch(
              "digest_schedule.subprocess.run", return_value=subprocess.CompletedProcess([], 1)
          ):
              launch_agent(root)
          path = temp / "Library/LaunchAgents" / (LABEL + ".plist")
          subprocess.run(["plutil", "-lint", str(path)], check=True)
          data = plistlib.loads(path.read_bytes())
          assert data["ProgramArguments"] == [sys.executable, str(root / "digest.py"), "tick"]
          assert data["Label"] == LABEL and data["WorkingDirectory"] == str(root)
          assert data["RunAtLoad"] and data["StartInterval"] == 60
          PY
          echo 'Apple plutil and field assertions passed on the generated plist. This step isolates launchctl from the real user domain.' >> "$GITHUB_STEP_SUMMARY"

      - name: Register and remove the LaunchAgent if a GUI domain exists
        run: |
          domain="gui/$(id -u)"
          service="$domain/local.hse-study-digest"
          if ! launchctl print "$domain" >/dev/null 2>&1; then
            echo "::notice::GUI domain unavailable. Live LaunchAgent registration was skipped."
            echo '**SKIPPED:** no accessible GUI domain on this runner. Live registration and removal were not tested.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import tomlkit
          from pathlib import Path
          path = Path("private/study.toml")
          config = tomlkit.parse(path.read_text())
          config["mcp"].update(enabled=False, demo=False)
          config["mail"].update(enabled=True, address="student@example.invalid", host="smtp.example.invalid")
          config["schedule"]["date_regex"] = "^NEVER$"
          path.write_text(tomlkit.dumps(config))
          PY
          test ! -e "$HOME/Library/LaunchAgents/local.hse-study-digest.plist"
          if launchctl print "$service" >/dev/null 2>&1; then exit 1; fi
          trap 'python digest.py remove-schedule' EXIT
          python digest.py install-schedule
          launchctl print "$service" >/dev/null
          python digest.py remove-schedule
          trap - EXIT
          test ! -e "$HOME/Library/LaunchAgents/local.hse-study-digest.plist"
          if launchctl print "$service" >/dev/null 2>&1; then exit 1; fi
          echo 'Verified the real launchctl install, service lookup and removal in the GUI domain. The date filter allowed zero deliveries.' >> "$GITHUB_STEP_SUMMARY"
