  <text x="807" y="503.02" fill="#76531f" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700">
    <tspan x="807" dy="0">private/plan-local.toml</tspan>
  </text>
  <polyline points="1055,530 1055,558 627,558 627,587" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="631,577 627,587 623,577" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" />
  <path d="M53 593 Q720.7 591.7 1266 593.4 Q1276 593.6 1276 604 Q1277.0 699.5 1275.7 796 Q1276 806 1266 806 Q597.3 807.0 52 805.6 Q42 806 42 796 Q41.0 688.9 42 603 Q42 593 53 593Z" fill="#eef4ed" stroke="#265d51" stroke-width="1.85" stroke-linejoin="round" />
  <text x="65" y="625.47" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700">
    <tspan x="65" dy="0">2   /   LOCAL ИЛИ RUN В РЕЖИМЕ LOCAL   ·   РАЗОБРАТЬ ЗАДАНИЯ</tspan>
  </text>
  <path d="M76 657 Q246.0 655.7 384 657.4 Q394 657.6 394 668 Q395.0 717.0 393.7 767 Q394 777 384 777 Q213.1 778.0 75 776.6 Q65 777 65 767 Q64.0 711.0 65 667 Q65 657 76 657Z" fill="#ffffff" stroke="#265d51" stroke-width="1.85" stroke-linejoin="round" />
  <text x="80" y="686.2" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700">
    <tspan x="80" dy="0">Настоящие сообщения</tspan>
  </text>
  <text x="80" y="713.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="80" dy="0">Telegram MCP отдаёт сообщения</tspan>
    <tspan x="80" dy="20.0">выбранных учебных групп.</tspan>
  </text>
  <path d="M474 657 Q646.7 655.7 787 657.4 Q797 657.6 797 668 Q798.0 717.0 796.7 767 Q797 777 787 777 Q613.3 778.0 473 776.6 Q463 777 463 767 Q462.0 711.0 463 667 Q463 657 474 657Z" fill="#dff3e9" stroke="#265d51" stroke-width="1.85" stroke-linejoin="round" />
  <text x="478" y="686.2" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700">
    <tspan x="478" dy="0">Разбор на Mac</tspan>
  </text>
  <text x="478" y="713.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="478" dy="0">Повторная проверка плана,</tspan>
    <tspan x="478" dy="20.0">поиск совпадений и срока</tspan>
    <tspan x="478" dy="20.0">в каждой подходящей строке.</tspan>
  </text>
  <path d="M876 657 Q1074.5 655.7 1236 657.4 Q1246 657.6 1246 668 Q1247.0 717.0 1245.7 767 Q1246 777 1236 777 Q1036.5 778.0 875 776.6 Q865 777 865 767 Q864.0 711.0 865 667 Q865 657 876 657Z" fill="#ffffff" stroke="#265d51" stroke-width="1.85" stroke-linejoin="round" />
  <text x="880" y="686.2" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700">
    <tspan x="880" dy="0">Строка таблицы</tspan>
  </text>
  <text x="880" y="713.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="880" dy="0">Предмет, стандартное название</tspan>
    <tspan x="880" dy="20.0">действия, срок и указатель</tspan>
    <tspan x="880" dy="20.0">на сообщение.</tspan>
  </text>
  <polyline points="397,720 457,720" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="447,716 457,720 447,724" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" />
