  <text x="45" y="854.47" fill="#415967" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="400">
    <tspan x="45" dy="0">Для нового локального запуска готовый план читается с диска. Если файла нет, продолжают работать базовые правила.</tspan>
  </text>
</svg>