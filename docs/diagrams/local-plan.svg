<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="local-plan-title local-plan-desc">
  <title id="local-plan-title">Как модель готовит правила для локального разбора</title>
  <desc id="local-plan-desc">Учебные примеры передаются модели, которая предлагает поисковые фразы. После проверки правила сохраняются на Mac и применяются к сообщениям Telegram локально без передачи реальных данных модели.</desc>
  <rect x="0" y="0" width="1320" height="900" fill="#fffcf6" />
  <text x="42" y="42.56" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700">
    <tspan x="42" dy="0">ПРАКТИКУМ   /   03</tspan>
  </text>
  <text x="42" y="89.85" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="35" font-weight="700">
    <tspan x="42" dy="0">Как модель помогает, когда переписка остаётся на Mac</tspan>
  </text>
  <text x="44" y="131.38" fill="#415967" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="18" font-weight="400">
    <tspan x="44" dy="0">Работа разделена на два запуска. Между ними передаётся файл с проверенными поисковыми фразами.</tspan>
  </text>
  <path d="M53 173 Q720.7 171.7 1266 173.4 Q1276 173.6 1276 184 Q1277.0 299.5 1275.7 416 Q1276 426 1266 426 Q597.3 427.0 52 425.6 Q42 426 42 416 Q41.0 286.9 42 183 Q42 173 53 173Z" fill="#eff3f8" stroke="#365c81" stroke-width="1.85" stroke-linejoin="round" />
  <text x="65" y="207.47" fill="#365c81" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="17" font-weight="700">
    <tspan x="65" dy="0">1   /   PLAN-LOCAL   ·   ПОДГОТОВИТЬ ПРАВИЛА</tspan>
  </text>
  <path d="M76 244 Q246.0 242.7 384 244.4 Q394 244.6 394 255 Q395.0 311.0 393.7 368 Q394 378 384 378 Q213.1 379.0 75 377.6 Q65 378 65 368 Q64.0 304.3 65 254 Q65 244 76 244Z" fill="#ffffff" stroke="#365c81" stroke-width="1.85" stroke-linejoin="round" />
  <text x="80" y="273.2" fill="#365c81" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700">
    <tspan x="80" dy="0">Учебные примеры</tspan>
  </text>
  <text x="80" y="300.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="80" dy="0">8 вымышленных поручений</tspan>
    <tspan x="80" dy="20.0">по четырём темам и 8 фраз,</tspan>
    <tspan x="80" dy="20.0">которые следует пропустить.</tspan>
  </text>
  <path d="M474 244 Q646.7 242.7 787 244.4 Q797 244.6 797 255 Q798.0 311.0 796.7 368 Q797 378 787 378 Q613.3 379.0 473 377.6 Q463 378 463 368 Q462.0 304.3 463 254 Q463 244 474 244Z" fill="#e8f0fc" stroke="#365c81" stroke-width="1.85" stroke-linejoin="round" />
  <text x="478" y="273.2" fill="#365c81" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700">
    <tspan x="478" dy="0">Агент по подписке</tspan>
  </text>
  <text x="478" y="300.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="478" dy="0">Получает только встроенные</tspan>
    <tspan x="478" dy="20.0">примеры. Предлагает типы</tspan>
    <tspan x="478" dy="20.0">и короткие поисковые фразы.</tspan>
  </text>
  <path d="M876 244 Q1074.5 242.7 1236 244.4 Q1246 244.6 1246 255 Q1247.0 311.0 1245.7 368 Q1246 378 1236 378 Q1036.5 379.0 875 377.6 Q865 378 865 368 Q864.0 304.3 865 254 Q865 244 876 244Z" fill="#ffffff" stroke="#265d51" stroke-width="1.85" stroke-linejoin="round" />
  <text x="880" y="273.2" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="20" font-weight="700">
    <tspan x="880" dy="0">Проверка на Mac</tspan>
  </text>
  <text x="880" y="300.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="880" dy="0">Разрешённые типы и грамматика.</tspan>
    <tspan x="880" dy="20.0">Оба примера каждого типа найдены.</tspan>
    <tspan x="880" dy="20.0">Лишних совпадений нет.</tspan>
  </text>
  <polyline points="397,310 457,310" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="447,306 457,310 447,314" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" />
  <polyline points="800,310 859,310" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="849,306 859,310 849,314" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" />
  <text x="65" y="405.56" fill="#415967" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="65" dy="0">Во вход модели включены только публичные образцы из local_plan.py.</tspan>
  </text>
  <polyline points="1055,427 1055,461" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="1059,451 1055,461 1051,451" fill="none" stroke="#526b73" stroke-width="2" stroke-linecap="round" />
