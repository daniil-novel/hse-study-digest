<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" role="img" aria-labelledby="topology-title topology-desc">
  <title id="topology-title">Как устроен учебный дайджест</title>
  <desc id="topology-desc">Архитектура. Локальная программа связывает расписание macOS, настройки участника, Telegram MCP и подписку модели. Результаты сохраняются в реестр групп и таблицу.</desc>
  <rect x="0" y="0" width="1320" height="1000" fill="#fffcf6" />
  <text x="42" y="42.56" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700">
    <tspan x="42" dy="0">ПРАКТИКУМ   /   01</tspan>
  </text>
  <text x="42" y="91.67" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="37" font-weight="700">
    <tspan x="42" dy="0">Как устроен учебный дайджест</tspan>
  </text>
  <text x="44" y="130.29" fill="#415967" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="400">
    <tspan x="44" dy="0">Из Telegram в таблицу ведёт локальная программа студента. Каждый источник получает отдельную роль.</tspan>
  </text>
  <text x="44" y="177.65" fill="#265d51" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700">
    <tspan x="44" dy="0">ЗАПУСК И ПОДКЛЮЧЕНИЯ</tspan>
  </text>
