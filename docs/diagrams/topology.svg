  </text>
  <text x="59" y="254.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="59" dy="0">Проверяет расписание</tspan>
    <tspan x="59" dy="20.0">через команду tick.</tspan>
  </text>
