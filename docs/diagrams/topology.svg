  </text>
  <text x="322" y="254.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="322" dy="0">ИУП, правила исключения</tspan>
    <tspan x="322" dy="20.0">и разрешённые области.</tspan>
  </text>
