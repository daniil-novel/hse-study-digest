    <tspan x="651" dy="0">Telegram MCP</tspan>
  </text>
  <text x="651" y="254.56" fill="#203543" font-family="Arial, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400">
    <tspan x="651" dy="0">Локальный stdio-сервер.</tspan>
    <tspan x="651" dy="20.0">В live обращается к Telegram</tspan>
    <tspan x="651" dy="20.0">по MTProto.</tspan>
  </text>
